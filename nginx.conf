# Nombre antiguo (28-09-2026): todo a la marca nueva
server {
    listen 80;
    server_name hervor.inhumario.com;
    return 301 https://puntodeinfusion.inhumario.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    access_log off;

    gzip on;
    gzip_types text/css application/xml application/rss+xml image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /static/ { expires 30d; add_header Cache-Control "public"; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
